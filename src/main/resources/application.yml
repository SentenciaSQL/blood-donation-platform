server:
  port: ${SERVER_PORT}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
    properties:
      hibernate.format_sql: true
      hibernate.show_sql: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED}
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: false

jwt:
  secret: ${JWT_SECRET}
  expirationMinutes: ${JWT_EXPIRATION_MINUTES}
  refreshExpirationDays: ${JWT_REFRESH_EXPIRATION_DAYS:7}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# DevTools restarts briefly re-evaluate security auto-config; suppress the noisy delta report.
logging:
  level:
    org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLoggingListener: OFF